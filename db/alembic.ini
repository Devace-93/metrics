# Alembic config for future schema migrations.
# The FIRST build creates tables via `python -m dbcore.cli upgrade`
# (SQLAlchemy create_all). Once the schema is live, generate real migrations:
#
#   cd db && alembic revision --autogenerate -m "describe change"
#   cd db && alembic upgrade head
#
# The DB URL is read from the environment (DATABASE_URL) in env.py, not here.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = ..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
