name: metrics

# Self-host overlay: NO billing (RevenueCat).
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml up -d
# Set BILLING_ENABLED=false in .env. The api service will not register the
# billing blueprint, the frontend hides paywalls, and plan limits come from
# config (default: selfhost = unlimited).

services:
  api:
    environment:
      BILLING_ENABLED: "false"

  web:
    environment:
      VITE_BILLING_ENABLED: "false"
