# Production overrides. metrics shares the Hetzner box with the 3m4 shortener
# (and exp, retro), whose Caddy already owns ports 80/443. metrics therefore
# runs WITHOUT its own Caddy in production: api, web and mcp join the external
# `edge` network and the 3m4 Caddyfile.prod routes metrics.3m4.net to them by
# container name (metrics-api-1, metrics-web-1, metrics-mcp-1).
#
# The GeoLite2 database is shared with the shortener: /opt/3m4/deploy/geoip is
# kept fresh by 3m4's weekly geoip-update.sh cron and mounted read-only here.
#
#   docker network create edge            # once per server
#   cd /opt/metrics/deploy
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    profiles: ["disabled"]

  api:
    networks: [default, edge]
    volumes:
      - /opt/3m4/deploy/geoip:/geoip:ro
  web:
    networks: [default, edge]
  mcp:
    networks: [default, edge]

networks:
  edge:
    external: true
